<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Board</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Ubuntu+Mono:wght@400;700&display=swap');
</style>
  
    <style>
        body {
            font-family: "Ubuntu Mono", system-ui;
/*            background-color: #000066;*/
            color: white;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Adjust alignment to top */
            min-height: 100vh;
            margin: 0;
            overflow-y: auto; /* Allow vertical scrolling */
            padding: 40px 10px 10px 10px; /* Add some padding to avoid content being flush with the edges */
        background: linear-gradient(150deg,#fea716,#d8a284,#201fdf,#8c9f4a,#a78385);
          background-size: 300% 300%;
          animation: gradient-animation 30s ease infinite;

        }

        @keyframes gradient-animation {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

        .board {
            display: grid;
            grid-template-columns: 260px repeat(5, 150px);
            grid-gap: 10px;
            text-align: center;
        }
        .category {
            font-size: 44px;
            background-color: #0033cc;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .field {
            width: 150px;
            height: 150px;
            background-color: #0033cc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            border-radius: 8px;
            position: relative;
            cursor: pointer;
        }
        .field:hover .close-btn {
            display: block;
        }
        .field.empty {
            background-color: #333399; /* A bit lighter than the background */
        }
        .close-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background-color: grey;
            border: none;
            color: white;
            font-size: 10px;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: none;
            cursor: pointer;
        }
        .modal {
            position: fixed;
            top: 50%;
/*            left: 50%;*/
            transform: translate(0%, -50%);
            background-color: white;
            color: black;
            padding: 20px;
            border-radius: 8px;
            display: none;
            z-index: 10;
            max-width: 80%;
            max-height: 80%;
            overflow: auto;
            font-size: 100px;
            -webkit-hyphens: auto;
            -ms-hyphens: auto;
            hyphens: auto;
/*            text-align: center;*/
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 9;
            display: none;
        }

        .help-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0033cc;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            z-index: 11;
        }

 @media (max-width: 768px) {
        .board {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%; /* Ensures the board takes up full width */
        }

        .category {
            width: 100%; /* Full width for category */
            font-size: 40px; /* Adjust font size for mobile */
            padding: 10px;
            background: none;
        }

        .field {
            width: 100%; /* Full width for each field */
            height: 80px; /* Adjust height for mobile */
            font-size: 20px; /* Adjust font size for mobile */
            margin-bottom: 5px; /* Space between fields */
        }
        .modal {
        font-size: 32px; /* Adjust font size for smaller screens */
    }
    }

    @media (max-width: 480px) {
        .category {
            font-size: 40px; /* Further reduce font size for very small screens */
            padding: 8px;
            background: none;
        }

        .field {
            height: 70px; /* Further adjust height */
            font-size: 18px; /* Further adjust font size */
            margin-bottom: 4px;
        }
        .modal {
        font-size: 24px; /* Further reduce font size for very small screens */
    }
    }
    </style>


</head>
<body>
  

<audio id="backgroundMusic" src="background.mp3" loop></audio>
<audio id="clickSound" src="open.mp3"></audio>

<button class="help-btn">?</button>

<div class="board">
    <!-- Category 1 -->
    <div class="category">Основы</div>
    <div class="field" data-question-id="11">10</div>
    <div class="field" data-question-id="12">20</div>
    <div class="field" data-question-id="13">30</div>
    <div class="field" data-question-id="14">40</div>
    <div class="field" data-question-id="15">50</div>

    <!-- Category 2 -->
    <div class="category">Технологии</div>
    <div class="field" data-question-id="21">10</div>
    <div class="field" data-question-id="22">20</div>
    <div class="field" data-question-id="23">30</div>
    <div class="field" data-question-id="24">40</div>
    <div class="field" data-question-id="25">50</div>

    <!-- Category 3 -->
    <div class="category">Культура</div>
    <div class="field" data-question-id="31">10</div>
    <div class="field" data-question-id="32">20</div>
    <div class="field" data-question-id="33">30</div>
    <div class="field" data-question-id="34">40</div>
    <div class="field" data-question-id="35">50</div>

    <!-- Category 4 -->
    <div class="category">История</div>
    <div class="field" data-question-id="41">10</div>
    <div class="field" data-question-id="42">20</div>
    <div class="field" data-question-id="43">30</div>
    <div class="field" data-question-id="44">40</div>
    <div class="field" data-question-id="45">50</div>

    <!-- Category 5 -->
    <div class="category">Будущее</div>
    <div class="field" data-question-id="51">10</div>
    <div class="field" data-question-id="52">20</div>
    <div class="field" data-question-id="53">30</div>
    <div class="field" data-question-id="54">40</div>
    <div class="field" data-question-id="55">50</div>
</div>

<div class="overlay"></div>
<div class="modal"></div>

<script>
    const fields = document.querySelectorAll('.field');
    const modal = document.querySelector('.modal');
    const overlay = document.querySelector('.overlay');
    const clickSound = document.getElementById('clickSound');
    const backgroundMusic = document.getElementById('backgroundMusic');

    let questionsData = null;

    // Load questions data from JSON
    async function loadQuestions() {
        const response = await fetch('questions.json');
        questionsData = await response.json();
    }

    // Helper function to find question by ID
    function findQuestion(questionId) {
        for (const category of questionsData.categories) {
            const question = category.questions.find(q => q.id === questionId);
            if (question) {
                return question;
            }
        }
        return null;
    }

    // Initialize the game
    loadQuestions().then(() => {
        // Attempt to play background music (requires user interaction in some browsers)
        document.body.addEventListener('click', () => {
            if (backgroundMusic.paused) {
                backgroundMusic.play();
            }
        });

        fields.forEach(field => {
            field.addEventListener('click', function() {
                const questionId = this.getAttribute('data-question-id');
                const questionData = findQuestion(questionId);

                if (questionData) {
                    modal.innerHTML = questionData.question;
                    modal.style.display = 'block';
                    overlay.style.display = 'block';

                    // Play click sound on each click
                    clickSound.currentTime = 0;
                    clickSound.play();

                    // Lower the background music volume to 50% when modal or overlay is displayed
                    adjustBackgroundVolume();
                }
            });

            const closeBtn = document.createElement('button');
            closeBtn.textContent = '✖';
            closeBtn.classList.add('close-btn');
            closeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                field.classList.add('empty');
                field.textContent = '';
            });
            field.appendChild(closeBtn);
        });

        overlay.addEventListener('click', function() {
            modal.style.display = 'none';
            overlay.style.display = 'none';

            // Restore background music volume when modal is closed
            adjustBackgroundVolume();
        });

        const helpBtn = document.querySelector('.help-btn');

        helpBtn.addEventListener('click', function() {
            if (questionsData) {
                modal.innerHTML = questionsData.rules;
                modal.style.display = 'block';
                overlay.style.display = 'block';
                adjustBackgroundVolume();
            }
        });
    });

    function adjustBackgroundVolume() {
        if (overlay.style.display === 'block' || modal.style.display === 'block') {
            backgroundMusic.volume = 0.2;
        } else {
            backgroundMusic.volume = 1.0;
        }
    }
</script>

</body>
</html>
